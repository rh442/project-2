<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advent Space Calendar</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">

</head>

<body>


    <div id="main-Container">
        <div id="Left-Container">
            <h1>Advent Space Calendar</h1>
            <!-- search bar here -->
            <div id="picker-bar">
                <label for="month-select">Month</label>
                <select id="month-select">
                    <option value="01">Jan</option>
                    <option value="02">Feb</option>
                    <option value="03">Mar</option>
                    <option value="04">Apr</option>
                    <option value="05">May</option>
                    <option value="06">Jun</option>
                    <option value="07">Jul</option>
                    <option value="08">Aug</option>
                    <option value="09">Sep</option>
                    <option value="10">Oct</option>
                    <option value="11">Nov</option>
                    <option value="12">Dec</option>
                </select>
                <label for="day-select">Day</label>
                <select id="day-select"></select>
                <button id="go-btn">Go</button>
            </div>
            <!-- <input> -->

            <br>
            <div id="button-container">
                <button id="toggle-calendar-btn">Hide Calendar</button>
                <button id="random-btn">Random Date</button>
            </div>
            <br>
            <div id="calendar"></div>

        </div>
        <div id="Right-Container">
            <h2 id="Title">Image Title</h2>
            <p id="Details">Click Image/Description to Flip</p>
            <img id='APOD' src="" alt="IMG HERE">
            <p id="Description">Explanation</p>

            <p id="Author">by author</p>
            <br>

        </div>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>

</body>

</html>
